[project]
name = "last-minute-lifesaver-backend"
version = "0.1.0"
description = "FastAPI backend for an autonomous productivity companion."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
